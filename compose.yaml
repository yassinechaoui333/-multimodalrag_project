services:
  streamlit:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
